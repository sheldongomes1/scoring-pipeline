[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "qqq-scoring"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-storage>=2.16",
    "google-cloud-bigquery>=3.20",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",
]

[tool.setuptools.packages.find]
where = ["src"]
